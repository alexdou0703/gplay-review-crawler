[server]
runOnSave = true

# Light base theme in brand colors. Without this Streamlit falls back to the
# viewer's OS preference — dark base under the light brand CSS made captions,
# radios, metrics, dataframes and chart canvases illegible.
[theme]
base = "light"
baseFontSize = 22
primaryColor = "#2563EB"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
